name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ghostwyre
          POSTGRES_PASSWORD: ghostwyre
          POSTGRES_DB: ghostwyre
        ports:
          - 5432:5432
        # Wait for Postgres to accept connections before the job's steps run, so
        # the @pytest.mark.slow DB tests have a database to talk to.
        options: >-
          --health-cmd "pg_isready -U ghostwyre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest derives ghostwyre_test from this and the app's default matches it.
      DATABASE_URL: postgresql+asyncpg://ghostwyre:ghostwyre@localhost:5432/ghostwyre

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync  # dev group includes tweepy, so the X tests can import it

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app scripts

      - name: Test (full suite, incl. Postgres-backed slow tests)
        run: uv run pytest -q
