services:
  postgres:
    image: postgres:17
    container_name: ghostwyre-postgres
    environment:
      POSTGRES_USER: ghostwyre
      POSTGRES_PASSWORD: ghostwyre
      POSTGRES_DB: ghostwyre
    ports:
      - "5432:5432"
    volumes:
      - ghostwyre_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostwyre"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ghostwyre_pgdata:
